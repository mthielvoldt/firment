// A message structure to control a signal generator's output waveform.

syntax = "proto3";
import "firment_msg.proto";

/* Project-specific messages */
enum WaveShape {
  UNSPECIFIED = 0;
  SINE = 1;
  SQUARE = 2;
  SAWTOOTH = 3;
  DC = 4;
}

enum OutputChannel {
  CHANNEL_A = 0;
  CHANNEL_B = 1;
}

message WaveformCtl {
  OutputChannel channel = 6;
  bool enabled = 5;
  WaveShape shape = 4;
  float amplitudeV = 1;
  float frequencyHz = 2;
  float offsetV = 3;
}

message WaveformTlm {
  WaveShape shape = 3;
  float voltageV = 1;
  sint32 currentMa = 2;
  bool ChannelAFault = 4;
  bool ChannelBFault = 5;
}



message Top {
  oneof sub {
    // the field numbers 1-15 should be reserved for messages sent frequently
    Ack Ack = 1;
    Log Log = 2;
    ProbeSignals ProbeSignals = 4;
    ImageData ImageData = 6;
    PageStatus PageStatus = 7;
    FirmentErrorTlm FirmentErrorTlm = 8;
    Hello Hello = 9;
    Version Version = 11;

    // Project-specific high-volume messages
    WaveformTlm WaveformTlm = 13;
    
    // These are sent infrequently.  Their field numbers should be > 15.
    Reset Reset = 14;
    TouchParam TouchParam = 16;
    ScanCtl ScanCtl = 20;
    ManualSnapCtl ManualSnapCtl = 21;
    
    // Project-specific low-volume messages.
    WaveformCtl WaveformCtl = 50;
  }
}